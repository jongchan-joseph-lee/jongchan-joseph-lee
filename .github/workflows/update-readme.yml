name: Update README (age, career)

on:
  schedule:
    - cron: "7 15 * * *"   # 매일 00:07 KST
  workflow_dispatch:
  push:
    paths: [README.template.md, scripts/render_readme.py]

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/render_readme.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update age / career in README"
            git push
          fi
      # 저장소에 60일 동안 활동이 없으면 GitHub가 예약 실행을 끄므로, 매번 다시 켜 둡니다
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-readme.yml --repo "${{ github.repository }}" || true
